name: eduearth
description: "EduEarth — Explore Energy, Understand Earth. Aplikasi edukasi energi terbarukan di Indonesia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  supabase_flutter: ^2.18.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  cached_network_image: ^4.0.6
  google_fonts: ^9.0.0
  flutter_markdown_plus: ^1.0.12
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

